worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  resolver 127.0.0.11 valid=5s;

  server {
    listen 8000;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"healthy"}';
    }

    location ^~ /api/v1/families {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/auth {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/users {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
      add_header X-Upstream-Addr $upstream_addr always;
      add_header X-Upstream-Status $upstream_status always;
    }

    location ^~ /api/v1/accounts {
      set $upstream_acct http://account-service:8002;
      proxy_pass $upstream_acct$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/categories {
      set $upstream_acct http://account-service:8002;
      proxy_pass $upstream_acct$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/transactions {
      set $upstream_txn http://transaction-service:8003;
      proxy_pass $upstream_txn$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/budgets {
      set $upstream_budget http://budget-service:8004;
      proxy_pass $upstream_budget$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/reports {
      set $upstream_report http://report-service:8005;
      proxy_pass $upstream_report$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/quotes {
      set $upstream_quote http://quote-service:8006;
      proxy_pass $upstream_quote$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }
  }
}

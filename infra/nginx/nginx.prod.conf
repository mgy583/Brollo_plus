worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"healthy"}';
    }

    location ^~ /api/v1/families {
      proxy_pass http://user-service:8001$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/auth {
      proxy_pass http://user-service:8001$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/users {
      proxy_pass http://user-service:8001$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/accounts {
      proxy_pass http://account-service:8002$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/categories {
      proxy_pass http://account-service:8002$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/transactions {
      proxy_pass http://transaction-service:8003$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/budgets {
      proxy_pass http://budget-service:8004$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/reports {
      proxy_pass http://report-service:8005$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location ^~ /api/v1/quotes {
      proxy_pass http://quote-service:8006$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

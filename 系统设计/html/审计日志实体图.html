<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计日志实体关系图</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .entity {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 2;
    }

    .attribute {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.5;
    }

    .line {
      stroke: #000000;
      stroke-width: 1.5;
    }

    .entity-text {
      font-size: 18px;
      font-weight: bold;
      fill: #000000;
    }

    .attr-text {
      font-size: 14px;
      fill: #000000;
    }
  </style>
</head>
<body>
<div class="container">

<svg viewBox="0 0 1400 900">

  <!-- 实体 -->
  <rect x="560" y="380" width="280" height="80" class="entity" />
  <text x="700" y="428" text-anchor="middle" class="entity-text">审计日志</text>

  <!-- 日志ID -->
  <ellipse cx="700" cy="230" rx="130" ry="35" class="attribute" />
  <text x="700" y="235" text-anchor="middle" class="attr-text">日志ID</text>
  <line x1="700" y1="265" x2="700" y2="380" class="line" />

  <!-- 左侧属性 -->
  <ellipse cx="300" cy="180" rx="130" ry="32" class="attribute" />
  <text x="300" y="185" text-anchor="middle" class="attr-text">管理员ID</text>
  <line x1="430" y1="200" x2="560" y2="395" class="line" />

  <ellipse cx="240" cy="340" rx="130" ry="32" class="attribute" />
  <text x="240" y="345" text-anchor="middle" class="attr-text">操作类型</text>
  <line x1="370" y1="340" x2="560" y2="410" class="line" />

  <ellipse cx="300" cy="560" rx="130" ry="32" class="attribute" />
  <text x="300" y="565" text-anchor="middle" class="attr-text">操作内容</text>
  <line x1="430" y1="545" x2="560" y2="435" class="line" />

  <!-- 右侧属性 -->
  <ellipse cx="1100" cy="260" rx="130" ry="32" class="attribute" />
  <text x="1100" y="265" text-anchor="middle" class="attr-text">操作IP</text>
  <line x1="970" y1="260" x2="840" y2="400" class="line" />

  <ellipse cx="1100" cy="520" rx="130" ry="32" class="attribute" />
  <text x="1100" y="525" text-anchor="middle" class="attr-text">创建时间</text>
  <line x1="970" y1="520" x2="840" y2="440" class="line" />

</svg>

</div>
</body>
</html>

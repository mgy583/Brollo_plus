<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员实体关系图</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .entity {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 2;
    }

    .attribute {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.5;
    }

    .line {
      stroke: #000000;
      stroke-width: 1.5;
    }

    .text {
      font-size: 14px;
      fill: #000000;
    }

    .entity-text {
      font-size: 18px;
      font-weight: bold;
      fill: #000000;
    }
  </style>
</head>
<body>
<div class="container">

<svg viewBox="0 0 1400 900">

  <!-- 实体 -->
  <rect x="560" y="380" width="280" height="80" class="entity" />
  <text x="700" y="428" text-anchor="middle" class="entity-text">管理员</text>

  <!-- 管理员ID -->
  <ellipse cx="700" cy="230" rx="130" ry="35" class="attribute" />
  <text x="700" y="235" text-anchor="middle" class="text">管理员ID</text>
  <line x1="700" y1="265" x2="700" y2="380" class="line" />

  <!-- 登录账号 -->
  <ellipse cx="300" cy="180" rx="130" ry="32" class="attribute" />
  <text x="300" y="185" text-anchor="middle" class="text">登录账号</text>
  <line x1="430" y1="200" x2="560" y2="390" class="line" />

  <!-- 登录密码 -->
  <ellipse cx="240" cy="320" rx="130" ry="32" class="attribute" />
  <text x="240" y="325" text-anchor="middle" class="text">登录密码</text>
  <line x1="370" y1="320" x2="560" y2="405" class="line" />

  <!-- 管理员姓名 -->
  <ellipse cx="300" cy="560" rx="130" ry="32" class="attribute" />
  <text x="300" y="565" text-anchor="middle" class="text">管理员姓名</text>
  <line x1="430" y1="545" x2="560" y2="435" class="line" />

  <!-- 角色权限 -->
  <ellipse cx="1100" cy="200" rx="130" ry="32" class="attribute" />
  <text x="1100" y="205" text-anchor="middle" class="text">角色权限</text>
  <line x1="970" y1="200" x2="840" y2="390" class="line" />

  <!-- 联系电话 -->
  <ellipse cx="1150" cy="340" rx="130" ry="32" class="attribute" />
  <text x="1150" y="345" text-anchor="middle" class="text">联系电话</text>
  <line x1="1020" y1="340" x2="840" y2="405" class="line" />

  <!-- 状态 -->
  <ellipse cx="1100" cy="560" rx="130" ry="32" class="attribute" />
  <text x="1100" y="565" text-anchor="middle" class="text">状态</text>
  <line x1="970" y1="545" x2="840" y2="435" class="line" />

  <!-- 创建时间 -->
  <ellipse cx="700" cy="760" rx="140" ry="35" class="attribute" />
  <text x="700" y="765" text-anchor="middle" class="text">创建时间</text>
  <line x1="700" y1="725" x2="700" y2="460" class="line" />

</svg>

</div>
</body>
</html>

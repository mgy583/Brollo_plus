<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户实体关系图</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .entity {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 2;
    }

    .attribute {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.5;
    }

    .main-key {
      stroke-width: 2;
    }

    .line {
      stroke: #000000;
      stroke-width: 1.5;
    }

    .entity-text {
      font-size: 18px;
      font-weight: bold;
      fill: #000000;
    }

    .attr-text {
      font-size: 14px;
      fill: #000000;
    }
  </style>
</head>
<body>
<div class="container">

<svg viewBox="0 0 1400 900">

  <!-- 中心实体 -->
  <rect x="560" y="380" width="280" height="80" class="entity" />
  <text x="700" y="428" text-anchor="middle" class="entity-text">用户</text>

  <!-- 主键 -->
  <ellipse cx="700" cy="240" rx="120" ry="35" class="attribute main-key" />
  <text x="700" y="245" text-anchor="middle" class="attr-text">用户编号（主键）</text>
  <line x1="700" y1="275" x2="700" y2="380" class="line" />

  <!-- 左上 -->
  <ellipse cx="300" cy="180" rx="110" ry="32" class="attribute" />
  <text x="300" y="185" text-anchor="middle" class="attr-text">用户名</text>
  <line x1="410" y1="200" x2="560" y2="390" class="line" />

  <!-- 左中上 -->
  <ellipse cx="250" cy="320" rx="110" ry="32" class="attribute" />
  <text x="250" y="325" text-anchor="middle" class="attr-text">登录密码</text>
  <line x1="360" y1="320" x2="560" y2="410" class="line" />

  <!-- 左中下 -->
  <ellipse cx="250" cy="500" rx="110" ry="32" class="attribute" />
  <text x="250" y="505" text-anchor="middle" class="attr-text">真实姓名</text>
  <line x1="360" y1="500" x2="560" y2="430" class="line" />

  <!-- 左下 -->
  <ellipse cx="320" cy="660" rx="110" ry="32" class="attribute" />
  <text x="320" y="665" text-anchor="middle" class="attr-text">手机号</text>
  <line x1="430" y1="640" x2="560" y2="450" class="line" />

  <!-- 右上 -->
  <ellipse cx="1100" cy="180" rx="110" ry="32" class="attribute" />
  <text x="1100" y="185" text-anchor="middle" class="attr-text">邮箱</text>
  <line x1="990" y1="200" x2="840" y2="390" class="line" />

  <!-- 右中上 -->
  <ellipse cx="1150" cy="320" rx="110" ry="32" class="attribute" />
  <text x="1150" y="325" text-anchor="middle" class="attr-text">头像</text>
  <line x1="1040" y1="320" x2="840" y2="410" class="line" />

  <!-- 右中下 -->
  <ellipse cx="1150" cy="500" rx="110" ry="32" class="attribute" />
  <text x="1150" y="505" text-anchor="middle" class="attr-text">性别</text>
  <line x1="1040" y1="500" x2="840" y2="430" class="line" />

  <!-- 右下 -->
  <ellipse cx="1080" cy="660" rx="110" ry="32" class="attribute" />
  <text x="1080" y="665" text-anchor="middle" class="attr-text">状态</text>
  <line x1="970" y1="640" x2="840" y2="450" class="line" />

  <!-- 底部 -->
  <ellipse cx="700" cy="760" rx="130" ry="35" class="attribute" />
  <text x="700" y="765" text-anchor="middle" class="attr-text">创建时间</text>
  <line x1="700" y1="725" x2="700" y2="460" class="line" />

</svg>

</div>
</body>
</html>
